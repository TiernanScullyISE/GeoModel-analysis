sonar.projectKey=TiernanScullyISE_GeoModel-analysis
sonar.organization=tiernanscullyise

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=GeoModel-analysis
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=GeoModelCore,GeoModelIO,GeoModelTools

# Analyse production source and keep generated/build artefacts out of the scope.
sonar.exclusions=**/build/**,**/build-*/*,**/generated/**,**/third_party/**,**/external/**,**/test/**,**/tests/**

# C/C++ compilation database produced by the Sonar Build Wrapper in CI.
sonar.cfamily.compile-commands=build-wrapper-output/compile_commands.json

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8